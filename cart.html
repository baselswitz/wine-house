<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart</title>
  <link rel="stylesheet" href="cart.css">
</head>
<body>
  <header class="cart-header">
    <h1>Your Cart 🛒</h1>
    <nav>
      <a href="index.html" class="back-btn">← Back to Shop</a>
    </nav>
  </header>

  <section class="cart-container">
    <table id="cartTable">
      <thead>
        <tr>
          <th>Image</th>
          <th>Product</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total</th>
          <th>Remove</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="cart-summary">
      <h2>Total: $<span id="cartTotal">0</span></h2>
      <button id="checkoutBtn" class="checkout-btn">Checkout</button>
    </div>
  </section>

  <script src="cart.js"></script>
</body>
</html>
