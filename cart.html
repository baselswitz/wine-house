<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart | Wine House</title>
  <link rel="stylesheet" href="css/cart.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="index.html#about">About</a>
    <a href="index.html#shop">Shop</a>
    <a href="cart.html" class="active">Cart</a>
  </nav>

  <!-- Cart Section -->
  <section class="cart-section">
    <h1>Your Shopping Cart</h1>

    <div class="cart-container">
      <!-- Example Cart Item -->
      <div class="cart-item">
        <img src="assets/images/wine1.jpg" alt="Wine 1">
        <div class="item-details">
          <h2>Red Merlot 2021</h2>
          <p>Elegant and smooth flavor.</p>
          <div class="item-actions">
            <span class="price">$25</span>
            <input type="number" value="1" min="1" class="quantity">
            <button class="remove-btn">Remove</button>
          </div>
        </div>
      </div>

      <div class="cart-item">
        <img src="assets/images/wine2.jpg" alt="Wine 2">
        <div class="item-details">
          <h2>White Chardonnay</h2>
          <p>Refreshing citrus notes.</p>
          <div class="item-actions">
            <span class="price">$30</span>
            <input type="number" value="1" min="1" class="quantity">
            <button class="remove-btn">Remove</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Total and Checkout -->
    <div class="cart-summary">
      <h3>Total: <span id="cart-total">$55</span></h3>
      <button class="checkout-btn">Proceed to Checkout</button>
    </div>
  </section>

  <script src="js/cart.js"></script>
</body>
</html>
